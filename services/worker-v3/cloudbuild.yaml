steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v3:$COMMIT_SHA'
      - '-f'
      - 'services/worker-v3/Dockerfile.build'
      - '.'
    timeout: 1200s

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v3:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'renombradorarchivosgdrive-worker-v3'
      - '--image'
      - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v3:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - '702567224563-compute@developer.gserviceaccount.com'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=us-central1,USE_SUPABASE=true'

images:
  - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v3:$COMMIT_SHA'

timeout: 1200s
