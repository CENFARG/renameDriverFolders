steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v2:20260503-203324'
      - '-f'
      - 'services/worker-renombrador/Dockerfile.build'
      - '.'
    timeout: 1200s

  # Push image explicitly before deploy
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v2:20260503-203324'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'renombradorarchivosgdrive-worker-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v2:20260503-203324'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

images:
  - 'gcr.io/$PROJECT_ID/renombradorarchivosgdrive-worker-v2:20260503-203324'

timeout: 1200s
