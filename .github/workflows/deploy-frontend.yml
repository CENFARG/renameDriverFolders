name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  PROJECT_ID: cloud-functions-474716
  SERVICE_NAME: renombradorarchivosgdrive-frontend-v2
  REGION: us-central1
  IMAGE_NAME: renombradorarchivosgdrive-frontend-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # En PRs, solo hacer build para verificar
    # En main, hacer deploy completo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            -f services/frontend/Dockerfile \
            services/frontend

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        if: github.event_name == 'push'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated

      # En PRs, solo reportar que el build fue exitoso
      - name: PR Build Success
        if: github.event_name == 'pull_request'
        run: |
          echo "✅ Frontend build successful! Ready to deploy."
          echo "This PR will be deployed when merged to main."
